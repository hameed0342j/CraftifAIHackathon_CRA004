# Mosquitto on the Jetson: sudo apt install mosquitto
# sudo cp deploy/mosquitto.conf /etc/mosquitto/conf.d/leaklatch.conf
# sudo mosquitto_passwd -c /etc/mosquitto/leaklatch.passwd pipegen   (then add node-bathroom-1, warden, ...)
listener 1883
allow_anonymous false
password_file /etc/mosquitto/leaklatch.passwd
acl_file /etc/mosquitto/leaklatch.acl
persistence true
